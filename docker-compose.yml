version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cctv_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: classroom_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cctv_attendance_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - ENVIRONMENT=production
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=classroom_db
      - SECRET_KEY=cctv-classroom-attendance-secure-key-2026
      - RTSP_URL=0
    volumes:
      - ./students:/app/students
      - ./data:/app/data

volumes:
  mysql_data:
